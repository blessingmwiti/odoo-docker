services:
  web:
    image: odoo:20.0
    container_name: odoo20-web
    depends_on:
      - db
    ports:
      - "10020:8069"
      - "10120:8072"
    volumes:
      - ./logs:/etc/odoo-logs/
      - odoo20-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./enterprise-addons:/mnt/enterprise-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: odoo20-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo20-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password

volumes:
  odoo20-web-data:
  odoo20-db-data:

secrets:
  postgresql_password:
    file: odoo_pg_pass
