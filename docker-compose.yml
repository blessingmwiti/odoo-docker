services:
  web:
    image: odoo:18.0
    container_name: odoo18-web
    depends_on:
      - db
    ports:
      - "10018:8069"
      - "10118:8072"
    volumes:
      - ./logs:/etc/odoo-logs/
      - odoo18-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./enterprise-addons:/mnt/enterprise-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
    secrets:
      - postgresql_password

  db:
    image: postgres:18
    container_name: odoo18-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo18-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password

volumes:
  odoo18-web-data:
  odoo18-db-data:

secrets:
  postgresql_password:
    file: odoo_pg_pass
