[options]
addons_path = /mnt/custom-addons,/mnt/enterprise-addons,/usr/lib/python3/dist-packages/odoo/addons
admin_passwd = strongPassword
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
logfile = /etc/odoo-logs/odoo-server.log
log_level = debug
xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069
#gevent port is used in odoo 19 over longpolling
#longpolling_port = 8072
gevent_port = 8072
proxy_mode = True
limit_time_cpu = 600
limit_time_real = 1200
#limit_memory_hard = 2684354560
#limit_memory_soft = 2147483648
#limit_request = 8192
workers = 2
